name: online_store_app
description: "mirsolioptom.uz - Online do'kon"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.0-282.1.beta

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.2
  cached_network_image: ^3.4.1
  shared_preferences: ^2.3.3
  intl: ^0.20.2
  flutter_map: ^8.1.1
  latlong2: ^0.9.1
  geolocator: ^13.0.2
